[project]
name = "cornerstone"
version = "0.1.0"
description = "Builds the weekly Cornerstone fantasy football report from Sleeper data."
readme = "README.md"
authors = [
    { name = "Brian Kwon", email = "bkwon94@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi>=0.158.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
cornerstone = "cornerstone.cli:main"

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff==0.0.272",
]

[tool.pytest.ini_options]
markers = ["live: calls a real external API"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120

# Pyright checks only the listed modules in basic mode. Each ticket adds the modules it touches.
# Backlog: history.py has one error, a Decimal type error in a round function.
[tool.pyright]
typeCheckingMode = "basic"
include = ["src/cornerstone/config.py", "src/cornerstone/files.py", "src/cornerstone/numbers.py", "src/cornerstone/paths.py",
           "src/cornerstone/render.py", "src/cornerstone/season_inputs.py", "src/cornerstone/sleeper.py"]

[tool.uv.build-backend]
# The pipeline and the API app are two packages under src, so the wheel holds both.
module-name = ["cornerstone", "cornerstone_api"]
