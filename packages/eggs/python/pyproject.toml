# The Python side of the eggs package: the store of the eggs and the claims, and the eggs routes of the API.
# It lists only the league package, so "uv run --exact --package cpc-eggs" fails an import of an app.
[project]
name = "cpc-eggs"
version = "0.1.0"
description = "The egg hunt: the store of the eggs and the claims, the egg check, the claim, the drop, the undo, and the egg board."
authors = [
    { name = "Brian Kwon", email = "bkwon94@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cpc-league",
    "fastapi>=0.158.0",
    "pydantic>=2.14.1",
]

[tool.uv.sources]
cpc-league = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
markers = ["live: calls a real external API"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120

# The eggs package imports the league package as its own code, so each sorts as first party in one block.
[tool.ruff.lint.isort]
known-first-party = ["eggs", "league"]

# Pyright checks only the listed modules in basic mode. Each ticket adds the modules it touches.
[tool.pyright]
typeCheckingMode = "basic"
include = ["src/eggs", "tests"]
# The tests import the rule modules of the pipeline tests, as tests/conftest.py puts them on the path.
extraPaths = ["../../../apps/pipeline/tests"]

[tool.uv.build-backend]
module-name = "eggs"
