# The Python side of the analyzer package: the trade rubric, the analysis, the finder, and the analyzer routes of the API.
# It lists only the league and the facts packages, so "uv run --exact --package cpc-analyzer" fails an import of an app.
[project]
name = "cpc-analyzer"
version = "0.1.0"
description = "The trade rubric, the analysis, the finder, the grade limits, and the analyzer routes of the API."
authors = [
    { name = "Brian Kwon", email = "bkwon94@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cpc-facts",
    "cpc-league",
    "fastapi>=0.158.0",
    "pydantic>=2.14.1",
]

[tool.uv.sources]
cpc-facts = { workspace = true }
cpc-league = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
markers = ["live: calls a real external API"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120

# The analyzer imports the league and the facts packages as its own code, so each sorts as first party in one block.
[tool.ruff.lint.isort]
known-first-party = ["analyzer", "facts", "league"]

# Pyright checks only the listed modules in basic mode. Each ticket adds the modules it touches.
[tool.pyright]
typeCheckingMode = "basic"
include = ["src/analyzer/advisor.py", "src/analyzer/cache.py", "src/analyzer/measures.py", "src/analyzer/team_facts.py",
           "src/analyzer/trade_jev.py", "src/analyzer/trade_splits.py", "src/analyzer/tunables.py", "tests"]
# The tests import the rule modules of the pipeline tests, as tests/conftest.py puts them on the path.
extraPaths = ["../../../apps/pipeline/tests"]

[tool.uv.build-backend]
module-name = "analyzer"
