# The Python side of the managers package: the entries of the managers file, the roster grade, and the file writer.
# It lists only the league and the facts packages, so "uv run --exact --package cpc-managers" fails an import of an app.
[project]
name = "cpc-managers"
version = "0.1.0"
description = "The managers file: the entries, the roster grade, the moves, the players, and the season so far."
authors = [
    { name = "Brian Kwon", email = "bkwon94@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cpc-facts",
    "cpc-league",
    "pydantic>=2.14.1",
]

[tool.uv.sources]
cpc-facts = { workspace = true }
cpc-league = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
markers = ["live: calls a real external API"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120

# The managers import the league and the facts packages as their own code, so each sorts as first party in one block.
[tool.ruff.lint.isort]
known-first-party = ["facts", "league", "managers"]

# Pyright checks only the listed modules in basic mode. Each ticket adds the modules it touches.
[tool.pyright]
typeCheckingMode = "basic"
include = ["src/managers/entries.py", "src/managers/render.py", "src/managers/tunables.py", "tests"]
# The tests import the rule modules of the pipeline tests, as tests/conftest.py puts them on the path.
extraPaths = ["../../../apps/pipeline/tests"]

[tool.uv.build-backend]
module-name = "managers"
