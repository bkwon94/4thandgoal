# Sets the commit status "verdict" on the head of each PR to main, from the VERDICTS.md of the Judge and the Test
# verdicts comments of Brian. A required check on "verdict" then blocks the merge of a spec PR until every acceptance
# test has PASS from the Judge and no FAIL from Brian (ADR 0026).
#
# The status API, and not a plain job result, carries the verdict. An issue_comment run belongs to the default
# branch, so its job result shows on main and never on the PR. A commit status on the PR head SHA shows on
# the PR from either event, and a new push gets a new run and a new status.
name: Verdict

on:
  pull_request:
    branches: [main]
  issue_comment:
    types: [created, edited]

# The job reads the PR, its comments, and three files, and writes one commit status. It needs no other access.
permissions:
  contents: read
  pull-requests: read
  statuses: write

# The last run for a PR wins, so a fast second comment does not lose to a slow first run.
concurrency:
  group: verdict-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  post-status:
    name: Post the verdict status
    # An issue_comment run also fires for a plain issue. Only a comment on a PR counts.
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The run always reads the script from main. A PR that edits scripts/verdict.py must not judge itself.
      # The ACCEPTANCE.md, EVIDENCE.md, and VERDICTS.md of the PR are data. The run reads them through the API and
      # runs no code of the PR.
      - name: Check out the verdict script
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/verdict.py
          sparse-checkout-cone-mode: false

      - name: Check the verdicts of the Judge and the latest Test verdicts comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # The branch name and the head SHA come from the API, so both events read the same values.
          gh api "repos/$REPO/pulls/$PR" > pr.json
          base=$(jq -r .base.ref pr.json)
          slug=$(jq -r .head.ref pr.json)
          sha=$(jq -r .head.sha pr.json)

          post() {
            gh api "repos/$REPO/statuses/$sha" -f state="$1" -f context=verdict \
              -f description="$2" -f target_url="$RUN_URL" > /dev/null
            echo "verdict: $1: $2"
          }

          if [ "$base" != "main" ]; then
            echo "The PR targets $base, not main. Nothing to judge."
            exit 0
          fi

          # Writes the body of one API call to a file. A 404 writes no file and returns 1. Any other error stops
          # the run, so a failed read never counts as a missing file.
          get() {
            out="$1"; shift
            if gh api "$@" > "$out" 2> error.txt; then return 0; fi
            rm -f "$out"
            if grep -q "HTTP 404" error.txt; then return 1; fi
            cat error.txt
            exit 1
          }
          contents="repos/$REPO/contents"
          raw="Accept: application/vnd.github.raw"

          # A Spec branch <slug> has .scratch/<slug>/ACCEPTANCE.md. A PR with no such file is not a spec PR,
          # such as a records PR, so it needs no Test verdict and passes.
          dir=".scratch/$slug"
          path="$dir/ACCEPTANCE.md"
          mkdir -p "$dir"
          if ! get "$path" -H "$raw" "$contents/$path?ref=$sha"; then
            post success "No $path, so this PR needs no Test verdict."
            exit 0
          fi

          # The contents API gives the git blob SHA of each file at the PR head in "sha". The script compares
          # them with the SHAs in VERDICTS.md. An empty SHA tells the script that the PR has no EVIDENCE.md.
          get acceptance_sha.txt "$contents/$path?ref=$sha" --jq .sha
          get evidence_sha.txt "$contents/$dir/EVIDENCE.md?ref=$sha" --jq .sha || : > evidence_sha.txt
          # With no VERDICTS.md, the script gets no file and fails with a rule that asks for the Judge.
          get "$dir/VERDICTS.md" -H "$raw" "$contents/$dir/VERDICTS.md?ref=$sha" || true

          gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
            --jq '.[] | {id, user: {login: .user.login}, created_at, body}' | jq -s . > comments.json

          if python3 scripts/verdict.py "$path" --verdicts "$dir/VERDICTS.md" \
               --acceptance-sha "$(cat acceptance_sha.txt)" --evidence-sha "$(cat evidence_sha.txt)" \
               --comments comments.json --owner "$OWNER" --summary summary.txt; then
            post success "$(cat summary.txt)"
          else
            post failure "$(cat summary.txt)"
          fi
