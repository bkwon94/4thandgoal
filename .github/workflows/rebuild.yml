# Runs the base and head rebuild on each PR to main whose diff selects the rebuild in scripts/scope.py.
# It rebuilds the facts and the render of the latest week of each client with the code of main and of the PR.
# It fails on a diff that the PR does not list as approved, and on a listed diff that does not change.
#
# The oracle is the code of main, not published/. After a merge, published/ keeps the old output until the next
# publish, so a diff against it would fail each later PR (ADR 0037).
name: Rebuild

on:
  pull_request:
    branches: [main]

# The job reads two checkouts and writes nothing back.
permissions:
  contents: read

concurrency:
  group: rebuild-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render-diff:
    name: Diff the render of main and the PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The run always reads its scripts from main. A PR that edits scripts/rebuild.py must not judge itself.
      # The base checkout also holds the code of main, so the base render runs it.
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: base

      # The full history gives the merge base of the PR and main to the scope script.
      - name: Check out the PR
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0

      - name: Read the scope of the diff
        id: scope
        env:
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # The first PR of the job finds no script on main yet. It passes and says why.
          for script in scope.py rebuild.py; do
            if [ ! -f "base/scripts/$script" ]; then
              echo "main has no scripts/$script yet, so the rebuild does not run."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          selects=$(cd head && python3 -B ../base/scripts/scope.py "origin/$BASE_REF" HEAD | tee /dev/stderr | sed -n 2p)
          case " $selects " in
            *" rebuild "*) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "The diff does not select the rebuild."; echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # uv reads the Python version from the root .python-version of each checkout.
      # setup-uv publishes no major tag from v8 on, so the step names the full release.
      - name: Set up uv
        if: steps.scope.outputs.run == 'true'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            base/uv.lock
            head/uv.lock

      # --locked fails the job if a uv.lock is out of date. Each checkout gets its own env of the pipeline.
      - name: Install the pipeline of main and of the PR
        if: steps.scope.outputs.run == 'true'
        run: |
          (cd base && uv sync --locked --exact --package cornerstone)
          (cd head && uv sync --locked --exact --package cornerstone)

      # The approved diffs are the lists that the PR adds or changes: REBUILD.md of a spec, or a quick file with a
      # Rebuild: block. An old list on main approves nothing, so a later PR cannot pass on the reason of another.
      - name: Diff the facts and the render of the latest week of each client
        if: steps.scope.outputs.run == 'true'
        env:
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          approved=()
          while IFS= read -r list; do
            approved+=(--approved "head/$list")
          done < <(cd head && git diff --name-only --diff-filter=AM "origin/$BASE_REF...HEAD" -- \
            '.scratch/*/REBUILD.md' '.scratch/bugs/*.md' '.scratch/quick-wins/*.md')
          python3 -B base/scripts/rebuild.py --base base --head head "${approved[@]}"
