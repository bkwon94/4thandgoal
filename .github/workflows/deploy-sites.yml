# Builds the static export of each client under clients/ and deploys it to the Cloudflare Worker of that client.
# It runs after a green check of a push to main, and on a manual dispatch for a ref, such as a spec branch.
# The check workflow runs once for each push to main, and this workflow starts from its workflow_run event.
name: Deploy sites

on:
  workflow_run:
    # The name of check.yml.
    workflows: [Check]
    types: [completed]
    branches: [main]
  # A spec branch can deploy before its merge, so the evidence of a live acceptance test comes from the live host.
  # Example: gh workflow run deploy-sites.yml --ref clients -f ref=clients
  workflow_dispatch:
    inputs:
      ref:
        description: "The branch, tag, or commit to deploy"
        type: string
        required: true
        default: main

# Each job only reads the repo, so the token gets no write scope.
permissions:
  contents: read

env:
  # A workflow_run deploys the commit that the check saw. A dispatch deploys the ref of its input.
  DEPLOY_REF: ${{ github.event.workflow_run.head_sha || inputs.ref }}

jobs:
  # A dispatch deploys a ref that no check saw, so it runs the check first. A workflow_run already has a green check.
  check:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ inputs.ref }}

  # One slug for each folder under clients/ with a client.toml, so a second client adds no workflow code.
  clients:
    needs: check
    # A workflow_run skips the job check, so !cancelled() lets this job run, and the rest picks the gate of each event.
    # A green check is the approval. A workflow_run deploys only for a green check of a push.
    if: >-
      !cancelled() && (
        (github.event_name == 'workflow_dispatch' && needs.check.result == 'success')
        || (github.event_name == 'workflow_run'
            && github.event.workflow_run.conclusion == 'success'
            && github.event.workflow_run.event == 'push')
      )
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.list.outputs.slugs }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}
      - name: List the clients
        id: list
        run: |
          slugs=$(for file in clients/*/client.toml; do basename "$(dirname "$file")"; done | jq -R . | jq -cs .)
          echo "slugs=${slugs}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: clients
    # A skipped job check would skip this job too, so the condition names only the result of the job clients.
    if: ${{ !cancelled() && needs.clients.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # A failed client does not stop the deploy of another client.
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.clients.outputs.slugs) }}
    # Two deploys of one Worker at once can conflict, so a second deploy waits for the first.
    # The group sits on the job and not on the workflow, so a run that deploys nothing never cancels a waiting deploy.
    concurrency:
      group: site-deploy-${{ matrix.slug }}
      cancel-in-progress: false
    # The site app lives in apps/site, so each run step starts there.
    defaults:
      run:
        working-directory: apps/site
    env:
      CLIENT: ${{ matrix.slug }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}

      # The pnpm version comes from the packageManager field of the site package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/site/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The prebuild step writes wrangler.jsonc for CLIENT: the Worker name is the slug, and the assets are out/.
      - name: Build and check the export of the client
        run: pnpm build && pnpm check:export

      # The config declares no route. Brian adds the Custom Domain <slug>.4thandgoal.app in the Cloudflare dashboard.
      - name: Deploy the Worker of the client
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/site
          packageManager: pnpm
          # The version of the dry run in the runbook. Change both together.
          wranglerVersion: "4.157.0"
          command: deploy
