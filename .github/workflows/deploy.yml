# Builds the Next.js static export and deploys it to GitHub Pages.
# It runs on a push to main that changes the site or this workflow, and on a manual dispatch.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The site app lives in apps/site, so each run step starts there.
    defaults:
      run:
        working-directory: apps/site
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The pnpm version comes from the packageManager field of the site package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/site/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One command runs typecheck, test, build, and the export check.
      # The deploy keeps its own check, so it never ships an unchecked build.
      - name: Check and build the export
        run: pnpm check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the export
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy step needs the Pages and OIDC grants.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
