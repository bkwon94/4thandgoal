# Runs "make check" at the root on each push to main and on each pull request.
# A branch with a PR runs once, because a push to a branch alone does not start it.
# The deploy workflows keep their own build steps. The API deploy also calls this workflow.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The pnpm version comes from the packageManager field of the site package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/site/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/site/pnpm-lock.yaml

      # uv reads the Python version from apps/pipeline/.python-version, and the cache keys on the pipeline lock file.
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          working-directory: apps/pipeline
          enable-cache: true
          cache-dependency-glob: apps/pipeline/uv.lock

      - name: Install the site dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/site

      - name: Install the pipeline dependencies
        run: uv sync --locked
        working-directory: apps/pipeline

      - name: Run the check
        run: make check
