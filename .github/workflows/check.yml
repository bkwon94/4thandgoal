# Runs "make check" at the root on each push to main and on each pull request.
# A branch with a PR runs once, because a push to a branch alone does not start it.
# The deploy workflows keep their own build steps. The API deploy also calls this workflow.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The pnpm version comes from the packageManager field of the site package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/site/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # uv reads the Python version from the root .python-version, and the cache keys on the root lock file.
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # One install at the root fills the whole pnpm workspace from the root lock file.
      - name: Install the site dependencies
        run: pnpm install --frozen-lockfile

      # Each check then runs its member with "uv run --exact --package", which trims the env to that member.
      - name: Install the Python dependencies
        run: uv sync --locked --all-packages

      - name: Run the check
        run: make check
