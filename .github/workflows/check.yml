# Runs "pnpm check" in apps/site on every push to any branch and on a manual dispatch.
# The deploy workflow keeps its own check, so a push to main runs the check twice.
name: Check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The site app lives in apps/site, so each run step starts there.
    defaults:
      run:
        working-directory: apps/site
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The pnpm version comes from the packageManager field of the site package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/site/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the check
        run: pnpm check
