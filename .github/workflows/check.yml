# The check of every push: it runs "make check", which runs lint, typecheck, and all the tests.
# The hook runs only the fast subset, so this job runs the full set on each branch. See docs/adr/0009-the-rules-are-checks.md.
name: Check

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the dependencies
        run: uv sync --locked
      - name: Run the check
        run: make check
