# The values of the NorCal client: the package list, the seasons, the package values, and the menu.
# league, facts, and design are in every client, so the list omits them. NorCal takes the same list as CPC.
packages = ["week", "rankings", "managers", "analyzer", "midseason", "sim"]
timezone = "America/New_York"
# The front door at / of the site. Off, / is the home page and the front door sits at the hidden /ask/ route.
front_door = false

# One table per season. The provider gives the sizes, the scoring, and the median game of each season.
[seasons.2026]
provider = "sleeper"
league_id = "1402948824305049600"

# Only the values that differ from the defaults in the package README.
[values.league]
# The closest chart: no chart for 6-point passing touchdowns exists.
# Known gap: each projection uses the Sleeper key pts_ppr, which counts 4-point passing touchdowns. NorCal counts 6,
# so each QB projection is 2 points low for each passing touchdown. The matchup scores stay exact.
chart = "1QB1.0PPR4pt"

# midseason takes its default roast, "savage", so the file has no [values.midseason]. sim has no values.

[values.analyzer]
finder = true

# The [menu] has no items, so the menu takes the home page, then the package list in its order.
# With the front door on, the menu is front_door_items: the same four items as CPC (front-door PRD).
[menu]
front_door_items = [
  { page = "home", label = "Home" },
  { package = "week" },
  { package = "rankings", label = "Power Rankings" },
  { package = "managers", label = "Managers" },
]
