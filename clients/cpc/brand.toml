# The brand of the CPC client: the light and the dark set. The fonts and the radii belong to the look, not the brand (ADR 0024).
# The schema is BRAND_SCHEMA in packages/design/site/brand/brand.ts. Dark is the default, and the theme button turns on light.
# Both sets are required.

# The light set of the look: a light page and white cards under a hero that stays dark in both themes.
# The base roles are required in each set.
[light]
accent = "#b8342a"
# The hero surface.
band = "#141414"
page = "#f4f4f4"
card = "#ffffff"
# One step up from the card, such as the active dock item.
raised = "#ebebeb"
text = "#141414"
muted = "#666666"
# The lines of the grid texture of the hero.
grid = "#1c1c1c"

# CPC overrides each derived role where the formula does not give the value of the look.
# The roles with no line here take the formula of the design package:
# - accent_glow, the red glow of the hero, is the accent 45% over transparent.
# - card_band, the surface of a checked row in the team picker, is the band.
# - divider, the thin rule between two columns, is the text 20% over the page.
[light.derived]
# The accent as text on the page and the card. The accent fills keep #b8342a, because white text sits on them.
accent_ink = "#a52e25"
# The accent text of the hero.
accent_text = "#f2a59e"
ink_2 = "#3a3a3a"
rule = "#e0e0e0"
bar_off = "#dddddd"
# The fill of a picked player row in the trade analyzer: the accent 10% over the white card. Over the page #f4f4f4 the
# muted text is only 4.50 to 1, so the wash mixes over the card. Ink text on it is 14.9 to 1, mute 4.9, and accent ink 5.0.
pick = { mix = "accent", percent = 10, over = "card" }
# The hero roles: the hero stays dark in both themes.
on_dark = "#ffffff"
on_dark_2 = "#cccccc"
on_dark_muted = "#999999"
rule_dark = "#333333"
chip_dark = "#262626"

# The dark theme re-points the light roles to dark partners, so no component changes a class. See ADR 0007.
# The page goes brand black, and the `card_band` surface lifts one step to #262626, so it keeps its edge. The hero keeps the band,
# so it sits flush with the page, and its rule gives its edge. The accent, the on-dark roles, and the glow do not re-point.
# The accent is 3.1 to 1 on #141414 and 2.6 to 1 on #262626, so it never carries text on a dark surface.
# The two dark surfaces are the page #141414 and the raised surface #262626. Each ratio below is on those two, in that order.
[dark]
# The accent never re-points (ADR 0007).
accent = "#b8342a"
band = "#141414"
# The raised surface of the look, such as the active dock item: the value of the dark board.
raised = "#262626"
# The lines of the grid texture of the hero, as in the light set.
grid = "#1c1c1c"
# The page. White text on it is 18.4 to 1.
page = "#141414"
# The light grey sits one step between the page and the lifted `card_band` surface: the grey card, the body from the tablet tier up, and the grey chip.
# A checked row in the team picker goes from this grey to the lifted `card_band` surface, so the grey must not equal the card.
# A picked player row does not paint this grey or the card. It paints the red wash of the pick.
# #1f1f1f is 1.1 to 1 on the page and 1.1 to 1 under the lifted `card_band` surface. On it white is 16.5 to 1, #ccc 10.3, #999 5.8, and light red 8.4.
card = "#1f1f1f"
# Body text: 18.4 to 1 on the page, 15.1 to 1 on the raised surface.
text = "#ffffff"
# Muted text: 6.5 to 1 on the page, 5.3 to 1 on the raised surface.
muted = "#999999"

[dark.derived]
accent_text = "#f2a59e"
# The hero text. The formula takes the light page, #f4f4f4, so the dark set names white.
on_dark = "#ffffff"
# Red text on the page: light red is 9.3 to 1 on the page and 7.7 to 1 on the raised surface.
accent_ink = "#f2a59e"
# The picked player row: a dark wash of brand red on the grey, #412421. White text on it is 14.1 to 1, #999 4.9, and light red 7.1.
# Brand red never carries text here, as the left rule of the row is only a graphic.
pick = { mix = "accent", percent = 22, over = "card" }
# The `card_band` surface lifts to the raised surface, 1.2 to 1 on the page. White text on it is 15.1 to 1, #ccc 9.4, #999 5.3, light red 7.7,
# the blue arrow 4.2, and the red arrow 4.1. Each text pair passes 4.5 to 1, and each arrow passes the 3 to 1 rule for a graphic.
card_band = "#262626"
# Second text: 11.5 to 1 on the page, 9.4 to 1 on the raised surface.
ink_2 = "#cccccc"
# The page rule: 1.5 to 1 on the page, 1.2 to 1 on the raised surface. A rule is a soft line, as #e3e3e3 is 1.3 to 1 on white.
rule = "#333333"
# The thin rule between two columns: 2.5 to 1 on the page and 2.0 to 1 on the raised surface. The light #cfcfcf is 1.6 to 1 on white.
divider = "#555555"
# The off bar of a chart: 4.1 to 1 on the page and 3.4 to 1 on the raised surface, so it passes the 3 to 1 rule for a graphic.
# In the waiver ring it sits in a #444 track at 2.2 to 1; the light theme puts it in a #333 track.
bar_off = "#777777"
on_dark_2 = "#cccccc"
on_dark_muted = "#999999"
# The dark rule, one step lighter, because #333 is only 1.2 to 1 on the lifted `card_band` surface. #444 is 1.9 to 1 on the page and 1.6 to 1 on the raised surface.
rule_dark = "#444444"
# The raised surface on the lifted `card_band` surface: a tab that is off and a box of the waiver sheet. The light #262626 equals the lifted `card_band` surface,
# so the chip goes one step up. #313131 is 1.2 to 1 on the lifted `card_band` surface. On it white is 13.0 to 1, #ccc 8.1, and #999 4.6.
# The chip stops below #333, because #999 is only 4.4 to 1 on #333 and fails the 4.5 to 1 rule for text.
chip_dark = "#313131"
