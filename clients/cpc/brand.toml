# The brand of the CPC client: the two radii, the two font stacks, and the light and the dark set.
# The schema is BRAND_SCHEMA in packages/design/site/brand/brand.ts. The light set is the report look and the default (ADR 0007).

# Small for tags and bars, card for every grey card.
radius_card = "8px"
radius_small = "3px"

# The site uses the system Helvetica, so no font file loads.
[fonts]
body = '"Helvetica Neue", Arial, sans-serif'
heading = '"Helvetica Neue", Arial, sans-serif'

# The six base roles are required in each set.
[light]
accent = "#b8342a"
band = "#141414"
page = "#ffffff"
card = "#ececec"
text = "#1a1a1a"
muted = "#666666"

# CPC overrides each derived role where the formula does not give its value today, so the CPC look stays exact.
# The roles with no line here take the formula of the design package:
# - accent_ink, the accent text on the page, is the accent. The accent text and the accent fills take different roles because
#   they sit on different grounds. The accent on white is 5.9 to 1, so the light set keeps it. On black it is only 3.1 to 1,
#   so the dark set re-points the role to light red. White text sits on the accent fills, so the fills keep the accent.
# - accent_glow, the red glow behind a hero cutout on a black card, is the accent 45% over transparent.
# - pick, the fill of a picked player row in the trade analyzer, is the accent 10% over the page: a light wash, so a pick
#   reads as red without red text on red. Ink text on it is 14.9 to 1, mute 4.9, and the accent 5.1.
# - card_band, the paint of the black card, is the band. It has its own role because the dark set lifts the card while
#   the masthead stays black. See ADR 0007.
# - on_dark is the page of the light set.
[light.derived]
# The accent text on a dark band.
accent_text = "#f2a59e"
ink_2 = "#333333"
rule = "#e3e3e3"
bar_off = "#cfcfcf"
# The thin rule between two columns.
divider = "#cfcfcf"
on_dark_2 = "#cccccc"
on_dark_muted = "#999999"
rule_dark = "#333333"
# The raised surface on the black card: a tab that is off and a box of the waiver sheet. It is one step up from the card, so it reads as a layer.
chip_dark = "#262626"

# The dark theme re-points the light roles to dark partners, so no component changes a class. See ADR 0007.
# The page goes brand black, and the black card lifts one step to #262626, so it keeps its edge. The masthead and the compact bar
# keep the band, so they sit flush with the page. The accent, the on-dark roles, and the glow do not re-point.
# The accent is 3.1 to 1 on #141414 and 2.6 to 1 on #262626, so it never carries text on a dark surface.
# The two dark surfaces are the page #141414 and the raised surface #262626. Each ratio below is on those two, in that order.
[dark]
# The accent never re-points (ADR 0007).
accent = "#b8342a"
band = "#141414"
# The page. White text on it is 18.4 to 1.
page = "#141414"
# The light grey sits one step between the page and the lifted black card: the grey card, the body from the tablet tier up, and the grey chip.
# A checked row in the team picker goes from this grey to the lifted black card, so the grey must not equal the card.
# A picked player row does not paint this grey or the card. It paints the red wash of the pick.
# #1f1f1f is 1.1 to 1 on the page and 1.1 to 1 under the lifted black card. On it white is 16.5 to 1, #ccc 10.3, #999 5.8, and light red 8.4.
card = "#1f1f1f"
# Body text: 18.4 to 1 on the page, 15.1 to 1 on the raised surface.
text = "#ffffff"
# Muted text: 6.5 to 1 on the page, 5.3 to 1 on the raised surface.
muted = "#999999"

[dark.derived]
accent_text = "#f2a59e"
# Red text on the page: light red is 9.3 to 1 on the page and 7.7 to 1 on the raised surface.
accent_ink = "#f2a59e"
# The picked player row: a dark wash of brand red on the grey, #412421. White text on it is 14.1 to 1, #999 4.9, and light red 7.1.
# Brand red never carries text here, as the left rule of the row is only a graphic.
pick = { mix = "accent", percent = 22, over = "card" }
# The black card lifts to the raised surface, 1.2 to 1 on the page. White text on it is 15.1 to 1, #ccc 9.4, #999 5.3, light red 7.7,
# the blue arrow 4.2, and the red arrow 4.1. Each text pair passes 4.5 to 1, and each arrow passes the 3 to 1 rule for a graphic.
card_band = "#262626"
# Second text: 11.5 to 1 on the page, 9.4 to 1 on the raised surface.
ink_2 = "#cccccc"
# The page rule: 1.5 to 1 on the page, 1.2 to 1 on the raised surface. A rule is a soft line, as #e3e3e3 is 1.3 to 1 on white.
rule = "#333333"
# The thin rule between two columns: 2.5 to 1 on the page and 2.0 to 1 on the raised surface. The light #cfcfcf is 1.6 to 1 on white.
divider = "#555555"
# The off bar of a chart: 4.1 to 1 on the page and 3.4 to 1 on the raised surface, so it passes the 3 to 1 rule for a graphic.
# In the waiver ring it sits in a #444 track at 2.2 to 1; the light theme puts it in a #333 track.
bar_off = "#777777"
on_dark_2 = "#cccccc"
on_dark_muted = "#999999"
# The dark rule, one step lighter, because #333 is only 1.2 to 1 on the lifted black card. #444 is 1.9 to 1 on the page and 1.6 to 1 on the raised surface.
rule_dark = "#444444"
# The raised surface on the lifted black card: a tab that is off and a box of the waiver sheet. The light #262626 equals the lifted black card,
# so the chip goes one step up. #313131 is 1.2 to 1 on the lifted black card. On it white is 13.0 to 1, #ccc 8.1, and #999 4.6.
# The chip stops below #333, because #999 is only 4.4 to 1 on #333 and fails the 4.5 to 1 rule for text.
chip_dark = "#313131"
