# The Fly.io config of the Cornerstone API: one small machine in the New York area that stops when idle.
# Secrets (ANTHROPIC_API_KEY, CORNERSTONE_PASSPHRASE) never go here. Set them with `fly secrets set`.

app = "cpcfantasy-api"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

# Non-secret settings only. /app/data is a link to the /data volume, so the repo root is /app.
[env]
  CORNERSTONE_REPO = "/app"
  CORNERSTONE_RESULT_CACHE_DIR = "/data/cache/results"
  CORNERSTONE_ALLOWED_ORIGINS = "https://cpcfantasy.com"

[http_service]
  internal_port = 8080
  force_https = true
  # The machine stops when no request comes, so an idle month costs cents. A request starts it again.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# One volume holds the tracked data seed, the nflverse cache, the charts, and the result cache, so they survive a restart.
[mounts]
  source = "cornerstone_data"
  destination = "/data"
