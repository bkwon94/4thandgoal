# The prek hook of this repo: it runs "make check-fast" before each commit.
# Install it one time per clone with "prek install". Each worktree then reads its own branch's config.
#
# The hook runs on the whole tree, not on the staged files. The subset takes seconds, so a file list saves nothing.
# The hook does not run "ruff --fix". A hook that writes files makes a commit that differs from the staged change.
repos:
  - repo: local
    hooks:
      - id: check-fast
        name: make check-fast
        entry: make check-fast
        language: system
        pass_filenames: false
        always_run: true
