# The prek hook config of the repo. Install it one time per clone with "prek install".
# The hook runs "pnpm check:fast" of the site in apps/site before each commit. CI runs the full "pnpm check".
repos:
  - repo: local
    hooks:
      - id: check-fast
        name: pnpm check:fast
        # pnpm runs the script from apps/site, the folder of the site package.json.
        entry: pnpm --dir apps/site check:fast
        language: system
        pass_filenames: false
        always_run: true
