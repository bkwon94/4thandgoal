<!-- Shared page shell: head, masthead brand, and footer.
     Pages fill the title, the week line, and the body. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Cornerstone League Weekly{% endblock %}</title>
{% block meta %}{% endblock %}
<link rel="stylesheet" href="{{ root }}static/style.css">
<script src="{{ root }}static/app.js" defer></script>
</head>
<body>
<main class="page">
  <header class="mast">
    <a class="brand" href="{{ root or './' }}"><img class="logo" src="{{ root }}static/logo.png" alt="Cornerstone"><div class="bar"></div><div><div class="t">Cornerstone</div><div class="s">League Weekly</div></div></a>
    {% block mast_extra %}{% endblock %}
  </header>
  {% block body %}{% endblock %}
  <footer class="foot">Cornerstone League 2026 · Built from Sleeper data</footer>
</main>
</body>
</html>
