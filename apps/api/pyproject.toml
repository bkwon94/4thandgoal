# The Cornerstone API app: the FastAPI service of the trade analyzer, a thin uv member apart from the pipeline.
# It lists each package it imports, so "uv run --exact --package cpc-api" fails an import it does not list.
[project]
name = "cpc-api"
version = "0.1.0"
description = "Serves the Cornerstone trade analyzer over HTTP."
authors = [
    { name = "Brian Kwon", email = "bkwon94@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cpc-analyzer",
    "cpc-eggs",
    "cpc-facts",
    "cpc-league",
    "cpc-managers",
    "fastapi>=0.158.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    # The exact pin pairs with ai 7.0.159 and @ai-sdk/react 4.0.163 of the site. VercelAIAdapter speaks the stream of
    # AI SDK v7 at sdk_version=7, and its docs give no minimum version, so a change of either side moves both pins.
    "pydantic-ai-slim[anthropic,ui]==2.66.0",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
cornerstone = { workspace = true }
cpc-analyzer = { workspace = true }
cpc-eggs = { workspace = true }
cpc-facts = { workspace = true }
cpc-league = { workspace = true }
cpc-managers = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

# The tests read the fixtures and the helper modules of the pipeline tests, so only the dev group lists the pipeline.
# The image installs no dev group, so it holds no pipeline code.
[dependency-groups]
dev = [
    "cornerstone",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
markers = ["live: calls a real external API"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120

# The API imports the analyzer, the eggs, the league, and the facts packages as its own code, so each sorts as first
# party.
[tool.ruff.lint.isort]
known-first-party = ["analyzer", "cornerstone_api", "eggs", "facts", "league", "managers"]

# Pyright checks only the listed modules in basic mode. Each ticket adds the modules it touches.
[tool.pyright]
typeCheckingMode = "basic"
include = ["src/cornerstone_api/app.py", "src/cornerstone_api/refresh.py", "src/cornerstone_api/ask.py",
           "src/cornerstone_api/ask_wording.py", "src/cornerstone_api/miss_log.py",
           "src/cornerstone_api/free_answer.py", "src/cornerstone_api/free_tools.py",
           "src/cornerstone_api/free_wording.py", "src/cornerstone_api/free_blocks.py", "src/cornerstone_api/free_feed.py",
           "src/cornerstone_api/claude_stream.py", "src/cornerstone_api/caps.py", "src/cornerstone_api/personal_topics.py",
           "src/cornerstone_api/personal_facts.py", "src/cornerstone_api/personal_wording.py",
           "src/cornerstone_api/answer_store.py", "src/cornerstone_api/chat_turns.py",
           "src/cornerstone_api/waiver_targets.py", "src/cornerstone_api/sources.py",
           "src/cornerstone_api/game_lock.py", "src/cornerstone_api/week_lineup.py", "src/cornerstone_api/start_sit.py"]

[tool.uv.build-backend]
module-name = "cornerstone_api"
