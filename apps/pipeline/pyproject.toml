[project]
name = "cornerstone"
version = "0.1.0"
description = "Builds the weekly Cornerstone fantasy football report from Sleeper data."
readme = "README.md"
authors = [
    { name = "Brian Kwon", email = "bkwon94@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cpc-facts",
    "cpc-league",
    "anthropic>=1.15.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
]

[tool.uv.sources]
cpc-facts = { workspace = true }
cpc-league = { workspace = true }
cpc-waiver = { workspace = true }

[project.scripts]
cornerstone = "cornerstone.cli:main"

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

# The core packages that the build calls sit in their own group, not in the dependencies. A group never passes to a
# member that lists the pipeline, so the API, which lists the pipeline for the analyzer, gets no core package it does
# not list, and "uv run --exact --package cpc-api" fails an import of one (AT-31).
[dependency-groups]
packages = ["cpc-waiver"]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff==0.17.3",
]

# Each pipeline command takes the core packages, because the build calls them.
[tool.uv]
default-groups = ["dev", "packages"]

[tool.pytest.ini_options]
markers = ["live: calls a real external API"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120

# The pipeline imports the league, the facts, and the waiver packages as its own code, so each sorts as first party
# in one block.
[tool.ruff.lint.isort]
known-first-party = ["cornerstone", "facts", "league", "waiver"]

# Pyright checks only the listed modules in basic mode. Each ticket adds the modules it touches.
# Backlog: the sheet package has 16 errors, all in bodies that the move kept as they are. Most pass an
# optional value, such as int | None, to Nums or to a helper that takes a plain value. base.py 1, drops.py 1,
# leaders.py 1, next_week.py 11, trades.py 2.
[tool.pyright]
typeCheckingMode = "basic"
# The modules of each package have their own list in the pyproject.toml of the package, such as packages/league/python.
include = ["src/cornerstone/render.py", "src/cornerstone/sheet/assemble.py",
           "tests/fakes.py", "tests/rule_report.py", "tests/test_layers.py",
           "tests/test_offense_report.py", "tests/test_provider.py", "tests/test_rule_ports.py",
           "tests/test_rule_readmes.py", "tests/test_rule_suppressions.py", "tests/test_rule_tracker.py"]

[tool.uv.build-backend]
module-name = "cornerstone"
