[project]
name = "cornerstone"
version = "0.1.0"
description = "Builds the weekly Cornerstone fantasy football report from Sleeper data."
readme = "README.md"
authors = [
    { name = "Brian Kwon", email = "bkwon94@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cpc-analyzer",
    "cpc-facts",
    "cpc-league",
    "cpc-week",
    "anthropic>=1.15.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
]

[tool.uv.sources]
cpc-analyzer = { workspace = true }
cpc-eggs = { workspace = true }
cpc-facts = { workspace = true }
cpc-league = { workspace = true }
cpc-managers = { workspace = true }
cpc-midseason = { workspace = true }
cpc-rankings = { workspace = true }
cpc-sim = { workspace = true }
cpc-waiver = { workspace = true }
cpc-week = { workspace = true }

[project.scripts]
cornerstone = "cornerstone.cli:main"

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

# The core packages that the build calls sit in their own group, not in the dependencies. A group never passes to a
# member that lists the pipeline, so the API, whose dev group lists the pipeline for the test fixtures, gets no core
# package it does not list, and "uv run --exact --package cpc-api" fails an import of one (AT-31).
[dependency-groups]
packages = ["cpc-eggs", "cpc-managers", "cpc-midseason", "cpc-rankings", "cpc-sim", "cpc-waiver"]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff==0.17.3",
]

# Each pipeline command takes the core packages, because the build calls them.
[tool.uv]
default-groups = ["dev", "packages"]

[tool.pytest.ini_options]
markers = [
    "live: calls a real external API",
    # A wall-time assertion fails when other workers load the CPU, so the test runs alone, after the parallel pass.
    "serial: measures wall time, so it runs alone and not under xdist",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120

# The pipeline imports the league, the facts, the analyzer, the eggs, the managers, the midseason, the rankings, the
# sim, the waiver, and the week packages as its own code, so each sorts as first party in one block.
[tool.ruff.lint.isort]
known-first-party = ["analyzer", "cornerstone", "eggs", "facts", "league", "managers", "midseason", "rankings", "sim",
                     "waiver", "week"]

# Pyright checks only the listed modules in basic mode. Each ticket adds the modules it touches.
# The modules of the week sheet moved into packages/week/python, which lists them and their backlog.
[tool.pyright]
typeCheckingMode = "basic"
# The modules of each package have their own list in the pyproject.toml of the package, such as packages/league/python.
include = ["src/cornerstone/render.py", "src/cornerstone/sheet/__init__.py",
           "tests/fakes.py", "tests/rule_report.py", "tests/test_layers.py",
           "tests/test_offense_report.py", "tests/test_provider.py", "tests/test_rule_ports.py",
           "tests/test_rule_readmes.py", "tests/test_rule_suppressions.py", "tests/test_rule_tracker.py"]

[tool.uv.build-backend]
module-name = "cornerstone"
