[project]
name = "cornerstone"
version = "0.1.0"
description = "Builds the weekly Cornerstone fantasy football report from Sleeper data."
readme = "README.md"
authors = [
    { name = "Brian Kwon", email = "bkwon94@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cpc-facts",
    "cpc-league",
    "cpc-week",
    "anthropic>=1.15.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
]

[tool.uv.sources]
cpc-facts = { workspace = true }
cpc-league = { workspace = true }
cpc-week = { workspace = true }

[project.scripts]
cornerstone = "cornerstone.cli:main"

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
markers = ["live: calls a real external API"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120

# The pipeline imports the league, the facts, and the week packages as its own code, so each sorts as first party in one block.
[tool.ruff.lint.isort]
known-first-party = ["cornerstone", "facts", "league", "week"]

# Pyright checks only the listed modules in basic mode. Each ticket adds the modules it touches.
# The modules of the week sheet moved into packages/week/python, which lists them and their backlog.
[tool.pyright]
typeCheckingMode = "basic"
# The modules of the league package have their own list in packages/league/python/pyproject.toml.
include = ["src/cornerstone/rank_score.py", "src/cornerstone/render.py",
           "src/cornerstone/sheet/__init__.py", "src/cornerstone/waiver_projection.py",
           "tests/fakes.py", "tests/rule_report.py", "tests/test_layers.py",
           "tests/test_offense_report.py", "tests/test_provider.py", "tests/test_rule_ports.py",
           "tests/test_rule_readmes.py", "tests/test_rule_suppressions.py", "tests/test_rule_tracker.py"]

[tool.uv.build-backend]
module-name = "cornerstone"
